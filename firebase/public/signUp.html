<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account • Indie Arcade</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0f29, #02040c);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      width: 90%;
      max-width: 420px;
      padding: 40px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 25px rgba(0,0,0,0.3);
      text-align: center;
    }
    h2 {
      margin-bottom: 25px;
      font-size: 28px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 16px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(to right, #3cb9ff, #0072ff);
      color: white;
    }
    .btn-primary:hover {
      filter: brightness(1.15);
    }
    .link {
      margin-top: 20px;
      display: block;
      color: #9fd6ff;
      cursor: pointer;
    }
    #error {
      margin-top: 15px;
      color: #ff6b6b;
      font-size: 14px;
      min-height: 18px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Create Account</h2>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <div id="error"></div>

  <button class="btn btn-primary" onclick="signup()">Sign Up</button>

  <span class="link" onclick="location.href='login.html'">Already have an account? Sign In</span>
</div>

<script src="firebase-auth.js"></script>

</body>
</html>
