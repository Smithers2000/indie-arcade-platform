<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome • Indie Arcade</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #0a0f29, #000000);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      text-align: center;
      padding: 40px;
      width: 90%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
    }
    .logo {
      font-size: 70px;
      margin-bottom: 15px;
    }
    h1 {
      margin: 0;
      font-size: 36px;
      font-weight: 700;
    }
    p {
      margin: 15px 0 30px;
      opacity: 0.85;
      font-size: 17px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      transition: 0.25s;
    }
    .btn-primary {
      background: linear-gradient(to right, #3cb9ff, #0072ff);
      color: white;
    }
    .btn-primary:hover {
      filter: brightness(1.2);
    }
    .btn-secondary {
      background: #ffffff15;
      border: 1px solid #ffffff30;
      color: white;
    }
    .btn-secondary:hover {
      background: #ffffff25;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">🎮</div>
  <h1>Indie Arcade</h1>
  <p>Your gateway to indie gaming.</p>

  <button class="btn btn-primary" onclick="location.href='login.html'">Sign In</button>
  <button class="btn btn-secondary" onclick="location.href='signup.html'">Create Account</button>
</div>

</body>
</html>
